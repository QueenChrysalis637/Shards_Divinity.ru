<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Бестиарий | Существа мира Аркем</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="nav-links">
  <a href="index.html"><i class="fas fa-home"></i> Главная</a>
  <a href="rules.html"><i class="fas fa-dice-d20"></i> Правила</a>
  <a href="words.html"><i class="fas fa-meteor"></i> Слова Творения</a>
  <a href="lore.html"><i class="fas fa-scroll"></i> Лор</a>
  <a href="bestiary.html" class="active"><i class="fas fa-dragon"></i> Бестиарий</a>
  <a href="tools.html"><i class="fas fa-tools"></i> Инструменты мастера</a>
  <a href="download.html"><i class="fas fa-download"></i> Скачать</a>
</div>

<div class="book">
  <div class="page">
   
    <div style="text-align: center;">
      <div class="page-title">
        <h1>📖 Бестиарий Аркема 📖</h1>
        <div class="subhead">Описания всех известных видов существ, с которыми могут столкнуться искатели приключений</div>
      </div>
    </div>

    <div class="bestiary-container">
      <div class="categories-sidebar">
        <h3><i class="fas fa-tags"></i> Типы врагов</h3>
        <div id="category-buttons"></div>
      </div>
      <div class="bestiary-content">
        <div id="category-title" class="category-title"></div>
        <div id="creatures-list" class="creature-grid"></div>
      </div>
    </div>

    <div class="footer-note" style="margin-top: 2rem;">
      <span><i class="fas fa-skull"></i> Многие из этих существ несут гибель, но знание — первая ступень к победе.</span>
    </div>
  </div>
</div>

<!-- Подключаем внешние данные бестиария -->
<script src="js/bestiary-data.js"></script>
<script>
  // Порядок категорий (соответствует оригиналу)
  const categoriesOrder = [
    "Ангелы", "Мистики", "Сотворённые Боги", "Вырожденные",
    "Смертные противники", "Животные", "Паразитные боги", "Реликты",
    "Оборотни", "Духи", "Призванные Существа", "Несотворённые", "Неупокоенные"
  ];

  let activeCategory = categoriesOrder[0];

  function renderCategoryButtons() {
    const container = document.getElementById('category-buttons');
    if (!container) return;
    container.innerHTML = '';
    categoriesOrder.forEach(cat => {
      const btn = document.createElement('div');
      btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
      let icon = 'fa-question';
      switch(cat) {
        case 'Ангелы': icon = 'fa-feather-alt'; break;
        case 'Мистики': icon = 'fa-hat-wizard'; break;
        case 'Сотворённые Боги': icon = 'fa-crown'; break;
        case 'Вырожденные': icon = 'fa-biohazard'; break;
        case 'Смертные противники': icon = 'fa-user-ninja'; break;
        case 'Животные': icon = 'fa-paw'; break;
        case 'Паразитные боги': icon = 'fa-bug'; break;
        case 'Реликты': icon = 'fa-landmark'; break;
        case 'Оборотни': icon = 'fa-wolf'; break;
        case 'Духи': icon = 'fa-ghost'; break;
        case 'Призванные Существа': icon = 'fa-magic'; break;
        case 'Несотворённые': icon = 'fa-skull'; break;
        case 'Неупокоенные': icon = 'fa-bone'; break;
        default: icon = 'fa-book';
      }
      btn.innerHTML = `<i class="fas ${icon}"></i><span>${cat}</span>`;
      btn.addEventListener('click', () => {
        activeCategory = cat;
        renderCategoryButtons();
        renderCreatures();
      });
      container.appendChild(btn);
    });
  }

  function renderCreatures() {
    const titleDiv = document.getElementById('category-title');
    const listDiv = document.getElementById('creatures-list');
    if (!titleDiv || !listDiv) return;

    const creatures = window.bestiaryData[activeCategory];
    titleDiv.innerHTML = `<i class="fas fa-folder-open"></i> ${activeCategory}`;

    if (!creatures || creatures.length === 0) {
      listDiv.innerHTML = '<div class="empty-message">Нет записей о существах этого типа в текущих хрониках.</div>';
      return;
    }

    listDiv.innerHTML = '';
    creatures.forEach(creature => {
      const card = document.createElement('div');
      card.className = 'creature-card';

      const nameDiv = document.createElement('div');
      nameDiv.className = 'creature-name';
      nameDiv.textContent = creature.name;

      const statsGrid = document.createElement('div');
      statsGrid.className = 'stats-grid';
      for (const [key, value] of Object.entries(creature.stats)) {
        const item = document.createElement('div');
        item.className = 'stat-item';
        const label = document.createElement('span');
        label.className = 'stat-label';
        label.textContent = key + ':';
        const valSpan = document.createElement('span');
        valSpan.className = 'stat-value';
        valSpan.textContent = value;
        item.appendChild(label);
        item.appendChild(valSpan);
        statsGrid.appendChild(item);
      }

      const descDiv = document.createElement('div');
      descDiv.className = 'creature-desc';
      descDiv.textContent = creature.desc;

      card.appendChild(nameDiv);
      card.appendChild(statsGrid);
      card.appendChild(descDiv);

      if (creature.tactics && creature.tactics.length === 6) {
        const tacticDiv = document.createElement('div');
        tacticDiv.className = 'tactic-table';
        tacticDiv.innerHTML = `<h4><i class="fas fa-dice-d6"></i> 1d6 Тактика</h4><ol>${creature.tactics.map(t => `<li>${t}</li>`).join('')}</ol>`;
        card.appendChild(tacticDiv);
      }

      listDiv.appendChild(card);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCategoryButtons();
    renderCreatures();
  });
</script>
<script src="js/main.js"></script>
</body>
</html>
